<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-raised);box-sizing:border-box}body{padding:0}.stage{position:relative;isolation:isolate;overflow:hidden;height:420px;background:var(--bg-navy-depth);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:0 40px;gap:24px}.stage>*{position:relative;z-index:1}.ph{width:260px;margin:0 auto;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg)}.ph img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}.stage>.mp-fx{position:absolute}</style></head><body><div class="stage" id="stage"><div class="mp-fx mp-fx--light-gold" style="z-index:0"></div><div class="mp-fx mp-fx--light-blue" style="z-index:0"></div><div style="display:grid;gap:16px;justify-items:start;z-index:5"><span class="mp-eyebrow" style="color:var(--mp-blue-200)">Camila em ação</span><h2 style="color:var(--text-on-navy);font-size:40px">Presença que se vê na rotina.</h2><button class="mp-btn mp-btn--primary mp-btn--lg mp-btn--glow">Agendar diagnóstico</button></div><div class="mp-tilt"><div class="mp-tilt__inner" id="tilt"><div class="ph"><img src="../assets/camila-autoridade-01-900.webp" alt="Camila"></div></div></div><div class="mp-fx mp-fx--scrim" style="z-index:2;width:55%"></div><div class="mp-fx mp-fx--grain" style="z-index:3"></div><div class="mp-fx mp-fx--vignette" style="z-index:3"></div></div><script>const st=document.getElementById('stage'),t=document.getElementById('tilt');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){st.addEventListener('pointermove',e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;t.style.setProperty('--rx',x);t.style.setProperty('--tx',x);t.style.setProperty('--ty',y)});st.addEventListener('pointerleave',()=>{['--rx','--tx','--ty'].forEach(p=>t.style.removeProperty(p))})}</script></body></html>
