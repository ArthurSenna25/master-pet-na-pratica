<!-- @dsCard group="Movimento" viewport="700x250" subtitle="opacity 0→1 + translateY 24→0 · 700ms · stagger 90ms" name="Reveal em cascata" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-raised);box-sizing:border-box}.t{display:flex;gap:16px;margin-top:8px}.t>div{flex:1}</style></head><body><div style="display:flex;justify-content:space-between;align-items:center"><span class="mp-eyebrow mp-reveal" style="--i:0">Etapa 01</span><button id="replay" class="mp-btn mp-btn--outline mp-btn--sm">Repetir</button></div><h2 class="mp-reveal" style="--i:1;font-size:36px;margin:12px 0 8px">Do olhar de fora à rotina que funciona.</h2><p class="mp-reveal" style="--i:2;color:var(--text-2);max-width:520px">Cada bloco entra 90ms depois do anterior, com a mesma curva.</p><div class="t"><div class="mp-card mp-reveal" style="--i:3"><div class="mp-card__body"><b class="mp-card__title" style="font-size:20px">Observar</b></div></div><div class="mp-card mp-reveal" style="--i:4"><div class="mp-card__body"><b class="mp-card__title" style="font-size:20px">Priorizar</b></div></div><div class="mp-card mp-reveal" style="--i:5"><div class="mp-card__body"><b class="mp-card__title" style="font-size:20px">Acompanhar</b></div></div></div><p style="font:13px var(--font-body);color:var(--text-2);margin-top:16px">cubic-bezier(.22,1,.36,1) · sem JS ou com reduced-motion o conteúdo aparece pronto.</p><script>document.documentElement.classList.add('mp-js');const els=[...document.querySelectorAll('.mp-reveal')];function play(){els.forEach(e=>{e.classList.remove('is-in')});void document.body.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(e=>e.classList.add('is-in'))))}play();document.getElementById('replay').onclick=play;</script></body></html>
